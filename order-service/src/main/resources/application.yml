server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:orderflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100   # stop clients requesting size=1000000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.orderflow.events

orders:
  # A PENDING/CONFIRMED order with no progress for this long is cancelled (lost event, service down too long).
  saga-timeout: ${ORDER_SAGA_TIMEOUT:15m}
  timeout-check-interval-ms: ${ORDER_TIMEOUT_CHECK_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
