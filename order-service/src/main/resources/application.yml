server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:orderflow}
  flyway:
    baseline-on-migrate: true   # databases created before Flyway: record them as version 1, skip V1
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100   # stop clients requesting size=1000000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is down (default waits 60 s): the outbox relay records the
        # attempt, releases its lock and retries on the next poll instead of hanging.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.orderflow.events

orders:
  # A PENDING/CONFIRMED order with no progress for this long is cancelled (lost event, service down too long).
  saga-timeout: ${ORDER_SAGA_TIMEOUT:15m}
  timeout-check-interval-ms: ${ORDER_TIMEOUT_CHECK_MS:60000}

management:
  metrics:
    tags:
      application: ${spring.application.name}   # every metric labelled with the service name
    distribution:
      percentiles-histogram:
        http.server.requests: true            # enables p95/p99 latency in Grafana
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
