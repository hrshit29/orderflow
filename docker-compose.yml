# Local dev stack.
#   Infra only (run services from your IDE):  docker compose up -d mysql kafka kafka-ui mailpit
#   Everything:                               docker compose up -d --build

x-service-env: &service-env
  DB_USERNAME: orderflow
  DB_PASSWORD: orderflow
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-service-deps: &service-deps
  mysql:
    condition: service_healthy
  mysql-init:
    condition: service_completed_successfully
  kafka:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: orderflow
      MYSQL_PASSWORD: orderflow
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs init.sql on every `up`, not just when the data volume is first created,
  # so a new service's database appears without wiping existing data. Idempotent (IF NOT EXISTS).
  mysql-init:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./infra/mysql/init.sql:/init.sql:ro
    entrypoint: ["sh", "-c", "mysql -h mysql -uroot -proot < /init.sql && echo 'databases ready'"]
    restart: "no"

  kafka:
    image: apache/kafka:3.9.1   # KRaft mode — no Zookeeper needed
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:   # browse topics, messages and the DLQ at http://localhost:8090
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: orderflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mailpit:    # fake SMTP server; read sent emails at http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  user-service:
    build: { context: ., args: { SERVICE: user-service } }
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/user_db
    depends_on: *service-deps

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/order_db
    depends_on: *service-deps

  inventory-service:
    build: { context: ., args: { SERVICE: inventory-service } }
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/inventory_db
    depends_on: *service-deps

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    ports: ["8084:8084"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/payment_db
      PAYMENT_DECLINE_ABOVE: 10000   # simulated gateway declines bigger charges
    depends_on: *service-deps

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    ports: ["8085:8085"]
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/notification_db
      NOTIFICATION_CHANNEL: email
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      <<: *service-deps
      mailpit:
        condition: service_started

volumes:
  mysql-data:
