# Default values: a complete local stack on Docker Desktop Kubernetes.
# Override per environment, e.g.  helm upgrade --install orderflow helm/orderflow -f values-prod.yaml

image:
  registry: ""             # e.g. ghcr.io/hrshit29  (empty = local images from `docker compose build`)
  tag: latest
  pullPolicy: IfNotPresent

# Secret holding DB_USERNAME, DB_PASSWORD, MYSQL_ROOT_PASSWORD, JWT_SECRET, ADMIN_PASSWORD.
# Set existingSecret in real environments (created by External Secrets / Sealed Secrets / Vault).
secrets:
  existingSecret: ""
  values:                  # DEV ONLY - used when existingSecret is empty
    DB_USERNAME: orderflow
    DB_PASSWORD: orderflow
    MYSQL_ROOT_PASSWORD: root
    JWT_SECRET: orderflow-local-dev-secret-change-me-32+bytes
    ADMIN_PASSWORD: admin12345

# Bundled infrastructure. Disable and point host/bootstrapServers at managed services (RDS, MSK, ...) in prod.
mysql:
  enabled: true
  host: mysql
  image: mysql:8.4
  storage: 2Gi
kafka:
  enabled: true
  bootstrapServers: kafka:29092
  image: apache/kafka:3.9.1
  storage: 2Gi
mailpit:
  enabled: true
  image: axllent/mailpit:latest

# Defaults applied to every service unless the service overrides them
defaults:
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 768Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

services:
  api-gateway:
    port: 8080
    serviceType: LoadBalancer        # the only service reachable from outside the cluster
    replicas: 2
    autoscaling: true
    waitFor: [ "user-service:8081" ]
    secretEnv: [ JWT_SECRET ]
    env:
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085

  user-service:
    port: 8081
    database: user_db
    secretEnv: [ JWT_SECRET, ADMIN_PASSWORD ]

  order-service:
    port: 8082
    database: order_db
    replicas: 2
    autoscaling: true
    env:
      ORDER_SAGA_TIMEOUT: 15m

  inventory-service:
    port: 8083
    database: inventory_db

  payment-service:
    port: 8084
    database: payment_db
    env:
      PAYMENT_DECLINE_ABOVE: "10000"

  notification-service:
    port: 8085
    database: notification_db
    replicas: 2
    autoscaling: true
    env:
      NOTIFICATION_CHANNEL: email
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"

ingress:
  enabled: false           # needs an ingress controller (ingress-nginx)
  className: nginx
  host: orderflow.localhost
