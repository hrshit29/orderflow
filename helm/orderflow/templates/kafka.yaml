{{- if .Values.kafka.enabled }}
{{- $labels := include "orderflow.labels" (dict "name" "kafka" "root" $) }}
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {{- $labels | nindent 4 }}
spec:
  selector: { app: kafka }
  ports: [ { name: client, port: 29092 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {{- $labels | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: {{- $labels | nindent 8 }}
    spec:
      enableServiceLinks: false   # stops KAFKA_PORT=tcp://... being injected and parsed as broker config
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: [ "sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data" ]
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports: [ { containerPort: 29092 } ]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:29092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:29092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          readinessProbe:
            tcpSocket: { port: 29092 }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ ReadWriteOnce ]
        resources: { requests: { storage: {{ .Values.kafka.storage }} } }
{{- end }}
