{{- if .Values.mailpit.enabled }}
{{- $labels := include "orderflow.labels" (dict "name" "mailpit" "root" $) }}
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: {{- $labels | nindent 4 }}
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: web, port: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: {{- $labels | nindent 8 }}
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports: [ { containerPort: 1025 }, { containerPort: 8025 } ]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
{{- end }}
