{{- if .Values.monitoring.enabled }}
{{- $labels := include "orderflow.labels" (dict "name" "prometheus" "root" $) }}
# ---------- Prometheus: finds pods by annotation, scrapes /actuator/prometheus ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: {{- $labels | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role            # namespace-scoped: Prometheus may only list pods in this namespace
metadata:
  name: prometheus
  labels: {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  labels: {{- $labels | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: {{- $labels | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: orderflow
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [ {{ .Release.Namespace }} ] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- $labels | nindent 4 }}
spec:
  selector: { app: prometheus }
  ports: [ { name: http, port: 9090 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: {{- $labels | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.monitoring | toJson | sha256sum | trunc 16 | quote }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
          ports: [ { containerPort: 9090 } ]
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
# ---------- Grafana: Prometheus datasource + OrderFlow dashboard, provisioned from files ----------
{{- $glabels := include "orderflow.labels" (dict "name" "grafana" "root" $) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels: {{- $glabels | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: orderflow
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels: {{- $glabels | nindent 4 }}
data:
  orderflow.json: |-
{{ .Files.Get "files/orderflow-dashboard.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {{- $glabels | nindent 4 }}
spec:
  selector: { app: grafana }
  ports: [ { name: http, port: 3000 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{- $glabels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: {{- $glabels | nindent 8 }}
      annotations:
        checksum/dashboard: {{ .Files.Get "files/orderflow-dashboard.json" | sha256sum | trunc 16 | quote }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          env:
            # local dev only: no login screen
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: "/var/lib/grafana/dashboards/orderflow.json" }
          ports: [ { containerPort: 3000 } ]
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
{{- end }}
