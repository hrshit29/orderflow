server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:orderflow}
  flyway:
    baseline-on-migrate: true   # databases created before Flyway: record them as version 1, skip V1
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is down (default waits 60 s): the outbox relay records the
        # attempt, releases its lock and retries on the next poll instead of hanging.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

security:
  jwt:
    # Shared HS256 secret, also configured on the API gateway. At least 32 bytes. Override in every real environment.
    secret: ${JWT_SECRET:orderflow-local-dev-secret-change-me-32+bytes}
    issuer: orderflow
    ttl: ${JWT_TTL:1h}
  admin:   # created on startup if missing
    email: ${ADMIN_EMAIL:admin@orderflow.local}
    password: ${ADMIN_PASSWORD:admin12345}

management:
  metrics:
    tags:
      application: ${spring.application.name}   # every metric labelled with the service name
    distribution:
      percentiles-histogram:
        http.server.requests: true            # enables p95/p99 latency in Grafana
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for Kubernetes

springdoc:
  swagger-ui:
    path: /swagger-ui.html
